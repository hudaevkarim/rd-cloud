name: Проверки

# Запускается на push в main и на каждом pull request. Ничего не публикует и не
# имеет прав на запись: workflow только говорит, зелёное ли состояние.
on:
  push:
    branches: [main]
  pull_request:

# Новый запущенный раунд отменяет предыдущий: править CI приходится часто, а
# ждать его результата незачем.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Тесты сервера ходят в Postgres: экземпляр поднимается сервис-контейнером,
    # локально база живёт в C:\rcdb.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rdcloud
          POSTGRES_PASSWORD: rdcloud
          POSTGRES_DB: rdcloud
          # Коллация ICU, а не умолчание образа.
          #
          # База с коллацией `C` приводит регистр ТОЛЬКО для ASCII, поэтому
          # поиск «пушкин» не нашёл бы «А. С. Пушкин», а lower() не сравнил бы
          # «Анна» с «анна». Локально это исправлено через
          # LOCALE_PROVIDER icu в tools/setup-databases.sql; здесь то же самое
          # задаётся на этапе initdb, потому что сервис создаёт базу сам.
          #
          # Без этой строки тест «поиск по каталогу находит по автору» падал бы
          # в CI, проходя локально: расхождение окружений, которое стоит дорого.
          POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=ru-RU
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rdcloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rdcloud:rdcloud@127.0.0.1:5432/rdcloud?schema=public
      # Отдельная база, а не та же самая.
      #
      # `migrate-test.mjs` и `tests/helpers/setup.ts` оба отказываются работать,
      # если в имени базы нет `rdcloud_test`. Ограничение не формальное: без него
      # миграции и TRUNCATE в тестах пришлись бы на рабочую базу, где лежат
      # загруженные книги. Раньше здесь стоял тот же `rdcloud`, что и в
      # DATABASE_URL, и шаг падал за ноль секунд — с сообщением про
      # `TEST_DATABASE_URL`, а не про коллизию баз.
      TEST_DATABASE_URL: postgresql://rdcloud:rdcloud@127.0.0.1:5432/rdcloud_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      # Prisma Client генерируется из schema.prisma и НЕ лежит в репозитории:
      # каталог packages/server/src/generated/ в .gitignore, потому что он
      # производный и на каждый прогон меняется.
      #
      # Шаг обязателен и должен идти до типов. Без него `tsc --noEmit` не находит
      # `../generated/prisma/client.js` — это 5 ошибок TS2307. За ними приходит
      # вторая волна из 5 ошибок TS7006/TS7031 «implicitly has an any type»: без
      # типов Prisma вывод типов в запросах обрывается, и параметры колбэков
      # теряют тип. Обе волны лечатся одним шагом, и подавлять их через `any`
      # или `skipLibCheck` не нужно — причина ровно одна, и она устраняется.
      #
      # База для шага не нужна: `generate` читает только схему. Проверено с
      # DATABASE_URL, указывающим на несуществующий порт, — генерация проходит.
      # Переменная обязана быть задана лишь потому, что prisma.config.ts читает
      # её через `env('DATABASE_URL')` при загрузке; в CI она берётся из env
      # уровня job.
      - name: Сгенерировать Prisma Client
        run: npm run db:generate

      # Типы и тесты идут до сборки: если типы или тесты сломаны, до сборки
      # дело не дойдёт, и падение будет с осмысленным сообщением.
      - name: Типы
        run: npm run typecheck

      # Тесты библиотеки не ходят в базу — идут первыми и падают быстро.
      - name: Тесты библиотеки
        run: npm run test:lib

      # Тестовая база. Сервис создаёт только `rdcloud` (POSTGRES_DB), поэтому
      # вторую создаём здесь — с той же ICU-коллацией, что у кластера: она
      # задана на уровне initdb и наследуется базами, а не задаётся на базу.
      - name: Создать тестовую базу
        env:
          PGPASSWORD: rdcloud
        run: createdb -h 127.0.0.1 -U rdcloud rdcloud_test

      # Миграции к тестовой базе. Скрипт подставляет TEST_DATABASE_URL в
      # DATABASE_URL и зовёт `migrate deploy`, а не `migrate dev`: у тестовой
      # базы нет состояния, которое надо сохранять, и `dev` заодно удалил бы её
      # вместе с данными параллельного прогона.
      - name: Миграции тестовой базы
        run: npm run db:migrate:test --workspace @rd/server

      - name: Тесты сервера
        run: npm run test:server

      # Сборка отдельно от тестов специально. Тесты идут по алиасам на
      # исходники (`@rd/library/parse` → `src/parse/index.ts`) — так они
      # запускаются на свежей копии без предварительной сборки. Проверка `dist`
      # ловит то, что тесты не видят: что пакет действительно собирается и что
      # `exports` в package.json указывают на существующие файлы.
      - name: Сборка
        run: npm run build

      # Пустой dist означал бы, что сборка «прошла», ничего не сделав. Проверяем
      # все три точки входа библиотеки и собранный сервер: именно на них
      # ссылаются server и web.
      - name: Проверить артефакты сборки
        run: |
          test -f packages/library/dist/parse/index.js
          test -f packages/library/dist/anchor/index.js
          test -f packages/library/dist/render/index.js
          test -f packages/shared/dist/index.js
          test -f packages/server/dist/index.js
          echo "артефакты на месте"

      # Отчёт о покрытии нужен и при зелёном прогоне: иначе узнать, что
      # проверял каждый тест, можно только по логам CI, а они живут 30 дней.
      - name: Отчёт о покрытии
        if: always()
        run: npm run test:coverage
        continue-on-error: true

      - name: Файлы покрытия
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore